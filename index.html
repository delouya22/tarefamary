<!DOCTYPE html>
<html lang="pt-BR" data-theme="auto" data-accent="oceano" data-color="soft">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meu Organizador</title>
<link rel="manifest" href="manifest.json?v=1">
<link rel="icon" href="icon-192.png?v=1">
<link rel="apple-touch-icon" href="icon-192.png?v=1">
<meta name="theme-color" content="#F4F2EE">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{
  --bg:#F4F2EE; --surface:#FFFFFF; --surface2:#F9F8F5; --ink:#1E2228; --muted:#6B7280; --line:#E4E0D8; --line2:#D6D1C6;
  --accent:#2F6FDB; --accent-ink:#fff; --danger:#C93C37; --ok:#2E9460; --warn:#D98A0B;
  --shadow:0 1px 2px rgba(30,34,40,.06),0 4px 14px rgba(30,34,40,.06);
  --r:14px; --tab-h:60px; --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
html[data-accent=floresta]{--accent:#2E8B57}
html[data-accent=ameixa]{--accent:#8453C7}
html[data-accent=brasa]{--accent:#D1453B}
html[data-accent=grafite]{--accent:#3B434E}
html[data-theme=dark]{--bg:#14171B;--surface:#1D2127;--surface2:#232830;--ink:#E8EAED;--muted:#98A0AB;--line:#2D333B;--line2:#3A414B;--shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3)}
@media (prefers-color-scheme:dark){html[data-theme=auto]{--bg:#14171B;--surface:#1D2127;--surface2:#232830;--ink:#E8EAED;--muted:#98A0AB;--line:#2D333B;--line2:#3A414B;--shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3)}}
html[data-theme=dark]{color-scheme:dark}
html[data-theme=light]{color-scheme:light}
/* fundos escolhidos pelo usuário */
html[data-bg=branco]{--bg:#FFFFFF;--surface:#FFFFFF;--surface2:#F5F5F6;--line:#E7E7E9;--line2:#D3D3D8}
html[data-bg=cinza]{--bg:#E8EAEE;--surface:#FFFFFF;--surface2:#F4F5F7;--line:#D9DCE2;--line2:#C6CAD2}
html[data-bg=grafite]{--bg:#14171B;--surface:#1D2127;--surface2:#232830;--ink:#E8EAED;--muted:#98A0AB;--line:#2D333B;--line2:#3A414B}
html[data-bg=preto]{--bg:#000000;--surface:#101113;--surface2:#17181B;--ink:#ECEDEF;--muted:#9AA0A8;--line:#26282C;--line2:#33363B}
html[data-bg=noite]{--bg:#0C1424;--surface:#15203A;--surface2:#1A2848;--ink:#E6ECF8;--muted:#93A1BF;--line:#27365A;--line2:#34456E}
html[data-bg=musgo]{--bg:#121A14;--surface:#1B261E;--surface2:#202D24;--ink:#E5EEE7;--muted:#93A798;--line:#2B3B2F;--line2:#385040}
html[data-theme=dark][data-accent=grafite]{--accent:#AEB7C4;--accent-ink:#14171B}
@media (prefers-color-scheme:dark){html[data-theme=auto][data-accent=grafite]{--accent:#AEB7C4;--accent-ink:#14171B}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink)}
.hidden{display:none!important}
.muted{color:var(--muted)}
.small{font-size:12.5px}
h1,h2,h3{margin:0}

/* ---------- layout ---------- */
#app{min-height:100vh;padding-bottom:calc(var(--tab-h) + var(--safe-b) + 20px)}
.topbar{display:none}
.wrap{max-width:1100px;margin:0 auto;padding:calc(14px + var(--safe-t)) 14px 0}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;height:calc(var(--tab-h) + var(--safe-b));padding-bottom:var(--safe-b);display:flex;background:var(--surface);border-top:1px solid var(--line)}
.tabbar button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);font-size:11.5px;font-weight:600}
.tabbar button svg{width:22px;height:22px}
.tabbar button.on{color:var(--accent)}
.fab{position:fixed;right:16px;bottom:calc(var(--tab-h) + var(--safe-b) + 14px);z-index:31;width:56px;height:56px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);font-size:30px;line-height:1;box-shadow:0 6px 18px rgba(0,0,0,.28)}
@media (min-width:860px){
  #app{padding-bottom:40px}
  .tabbar{display:none}
  .topbar{display:flex;align-items:center;gap:18px;position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--line);padding:0 22px;height:56px}
  .topbar .brand{font-weight:800;font-size:17px;letter-spacing:-.2px}
  .topbar nav{display:flex;gap:4px;flex:1}
  .topbar nav button{border:0;background:none;padding:8px 14px;border-radius:10px;font-weight:600;color:var(--muted)}
  .topbar nav button:hover{background:var(--surface2)}
  .topbar nav button.on{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
  .fab{bottom:28px;right:28px}
  .wrap{padding:22px 22px 0}
}

/* ---------- basics ---------- */
.btn{border:1px solid var(--line2);background:var(--surface);border-radius:10px;padding:8px 13px;font-weight:600;font-size:14px;min-height:38px}
.btn:hover{background:var(--surface2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--line2))}
.btn.sm{padding:4px 9px;min-height:30px;font-size:12.5px;border-radius:8px}
.iconbtn{border:0;background:none;width:38px;height:38px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);font-size:18px}
.iconbtn:hover{background:var(--surface2);color:var(--ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.sec{margin:18px 0 8px;display:flex;align-items:center;gap:8px}
.sec h3{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:800}
.sec .count{font-size:12px;background:var(--surface2);border:1px solid var(--line);border-radius:99px;padding:0 8px;color:var(--muted)}
.sec .sp{flex:1}
.sec.warn h3{color:var(--danger)}
.pagehead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pagehead h2{font-size:22px;letter-spacing:-.3px;flex:1;min-width:150px}
.seg{display:inline-flex;background:var(--surface2);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:8px;font-weight:600;font-size:13.5px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.empty{padding:22px;text-align:center;color:var(--muted);border:1.5px dashed var(--line2);border-radius:var(--r)}
details.fold>summary{list-style:none;cursor:pointer}
details.fold>summary::-webkit-details-marker{display:none}
.chev{display:inline-block;transition:transform .15s}
details[open] .chev{transform:rotate(90deg)}

/* ---------- task card ---------- */
.tl{display:flex;flex-direction:column;gap:7px}
.task{--ac:#7A828F;display:flex;align-items:flex-start;gap:10px;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--ac);border-radius:12px;padding:10px 6px 10px 12px;position:relative}
html[data-color=bold] .task{background:color-mix(in srgb,var(--ac) 13%,var(--surface));border-color:color-mix(in srgb,var(--ac) 45%,var(--line));border-left-color:var(--ac)}
.task .ck{flex:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--line2);background:var(--surface);display:flex;align-items:center;justify-content:center;color:transparent;padding:0}
.task .ck svg{width:16px;height:16px}
.task .ck:hover{border-color:var(--ac)}
.task.done .ck{background:var(--ac);border-color:var(--ac);color:#fff}
.task .tb{flex:1;min-width:0;cursor:pointer}
.task .tt{font-weight:600;word-break:break-word}
.task.done .tt{text-decoration:line-through;color:var(--muted);font-weight:500}
.task.done{opacity:.7}
.meta{display:flex;flex-wrap:wrap;gap:3px 10px;font-size:12.5px;color:var(--muted);margin-top:2px;align-items:center}
.meta .ad{display:inline-flex;align-items:center;gap:5px}
.meta .ad i{width:8px;height:8px;border-radius:50%;background:var(--ac);display:inline-block}
.meta .late{color:var(--danger);font-weight:700}
.meta .soon{color:var(--warn);font-weight:700}
.chip{display:inline-block;font-size:11.5px;padding:0 7px;border-radius:99px;background:color-mix(in srgb,var(--ac,#7A828F) 16%,transparent);color:var(--ink);border:1px solid color-mix(in srgb,var(--ac,#7A828F) 30%,transparent)}
.qm{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.menu{position:fixed;z-index:80;background:var(--surface);border:1px solid var(--line2);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.25);padding:6px;min-width:190px}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:10px 12px;border-radius:8px;font-size:14.5px}
.menu button:hover{background:var(--surface2)}
.menu button.danger{color:var(--danger)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}

/* ---------- Hoje ---------- */
.hoje-grid{display:grid;grid-template-columns:1fr;gap:16px;margin-top:12px}
@media (min-width:860px){.hoje-grid{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);align-items:start}.hoje-grid .padcol{position:sticky;top:72px}.only-mobile{display:none!important}}
.daynav{display:flex;align-items:center;gap:4px}
.daynav .lbl{font-weight:800;font-size:20px;letter-spacing:-.3px;min-width:0;flex:1}
.prog{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:10px}
.prog i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.qa{display:flex;gap:8px;margin-top:14px;align-items:stretch}
.qa input[type=text]{flex:1;min-width:0;padding:11px 13px;border:1px solid var(--line2);border-radius:11px;background:var(--surface);font-size:16px}
.qa{flex-wrap:wrap}
@media (max-width:600px){.qa input[type=text]{flex:1 1 100%}.qa select{flex:1;min-height:44px;max-width:none}.qa .btn{flex:1;min-height:44px}}
.qa select{padding:0 8px;border:1px solid var(--line2);border-radius:11px;background:var(--surface);font-size:14px;max-width:130px}
.qa input:focus,.qa select:focus{outline:2px solid color-mix(in srgb,var(--accent) 50%,transparent);outline-offset:1px}
.deadl{display:flex;flex-direction:column;gap:6px}
.dl{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--surface);border:1px solid var(--line);border-radius:11px;cursor:pointer;--ac:#7A828F}
.dl .dot{width:9px;height:9px;border-radius:50%;background:var(--ac);flex:none}
.dl .nm{flex:1;min-width:0;font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dl .cd{font-size:12.5px;font-weight:700;color:var(--muted);white-space:nowrap}
.dl .cd.late{color:var(--danger)}.dl .cd.soon{color:var(--warn)}
.padbox{padding:0;overflow:hidden}
.padtools{display:flex;gap:3px;flex-wrap:wrap;padding:8px;border-bottom:1px solid var(--line);background:var(--surface2);align-items:center}
.padtools button,.padtools select{border:1px solid transparent;background:none;border-radius:8px;min-width:34px;height:34px;padding:0 6px;font-weight:700}
.padtools button:hover{background:var(--surface);border-color:var(--line)}
.padtools select{border-color:var(--line);background:var(--surface);font-weight:500;font-size:13px}
.padtools .sep{width:1px;height:20px;background:var(--line2);margin:0 3px}
.pad{min-height:280px;padding:14px;outline:none;font-size:16px;line-height:1.55;word-break:break-word}
.pad:empty::before{content:attr(data-ph);color:var(--muted)}
.pad ul,.pad ol{margin:.3em 0;padding-left:1.4em}
@media (min-width:860px){.pad{min-height:420px}}

/* ---------- Áreas ---------- */
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.achip{--ac:#7A828F;flex:none;border:1.5px solid color-mix(in srgb,var(--ac) 45%,var(--line));background:var(--surface);border-radius:99px;padding:7px 14px;font-weight:700;font-size:13.5px;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.achip i{width:10px;height:10px;border-radius:50%;background:var(--ac)}
.achip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.achip.on i{background:#fff}
.achip .n{font-weight:600;opacity:.7;font-size:12px}
.areahead{--ac:#7A828F;border-left:6px solid var(--ac);padding:12px 14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
html[data-color=bold] .areahead{background:color-mix(in srgb,var(--ac) 16%,var(--surface))}
.areahead h2{flex:1;font-size:20px;min-width:140px}
.tagbar{display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;margin-top:10px;padding-bottom:4px;scrollbar-width:none}
.tagbar button{flex:none;white-space:nowrap}
.tagbar button{border:1px solid var(--line2);background:var(--surface);border-radius:99px;padding:3px 11px;font-size:12.5px;font-weight:600}
.tagbar button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* ---------- Semana ---------- */
.wk-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.wk-top .lbl{font-weight:800;font-size:18px;flex:1;min-width:140px}
.wk-layout{display:grid;grid-template-columns:1fr;gap:12px;margin-top:10px}
@media (min-width:1000px){.wk-layout{grid-template-columns:minmax(0,1fr) 230px;align-items:start}}
.daypills{display:flex;gap:6px;margin-top:8px}
.daypills button{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:6px 0;font-weight:700;font-size:12px;color:var(--muted);line-height:1.2}
.daypills button b{display:block;font-size:16px;color:var(--ink)}
.daypills button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.daypills button.on b{color:var(--accent-ink)}
.daypills button.today:not(.on){border-color:var(--accent)}
.wk{overflow:hidden;margin-top:8px}
.wk-scroll{overflow:auto;max-height:calc(100vh - 290px);min-height:360px;position:relative}
.wk-sticky{position:sticky;top:0;z-index:5;background:var(--surface)}
.wk-head{display:flex;border-bottom:1px solid var(--line)}
.wk-head .gut{width:42px;flex:none}
.wk-head .dh{flex:1;min-width:0;text-align:center;padding:6px 2px;font-size:12px;font-weight:700;color:var(--muted);border-left:1px solid var(--line)}
.wk-head .dh b{display:block;font-size:15px;color:var(--ink)}
.wk-head .dh.today b{color:var(--accent-ink);background:var(--accent);display:block;width:max-content;min-width:26px;padding:0 6px;margin:0 auto;border-radius:99px}
.untimed{display:flex;border-bottom:1px solid var(--line);background:var(--surface2)}
.untimed .gut{width:42px;flex:none;font-size:10px;color:var(--muted);padding:4px 2px;text-align:center}
.untimed .uc{flex:1;min-width:0;border-left:1px solid var(--line);padding:3px;display:flex;flex-direction:column;gap:3px;min-height:6px}
.uchip{--ac:#7A828F;font-size:11.5px;font-weight:600;border-left:4px solid var(--ac);background:var(--surface);border-radius:6px;padding:2px 6px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.uchip.done{text-decoration:line-through;opacity:.6}
.uchip.pick,.pitem.pick{outline:2px solid var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface))}
.wk-body{display:flex;position:relative}
.wk-gutter{width:42px;flex:none;position:relative}
.wk-gutter span{position:absolute;right:5px;font-size:10.5px;color:var(--muted);transform:translateY(-50%)}
.wk-col{flex:1;min-width:0;position:relative;border-left:1px solid var(--line);background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(color-mix(in srgb,var(--line) 45%,transparent) 1px,transparent 1px);cursor:cell}
.wk-col.today{background-color:color-mix(in srgb,var(--accent) 5%,transparent)}
.blk{--ac:#7A828F;position:absolute;border-radius:8px;border-left:5px solid var(--ac);background:color-mix(in srgb,var(--ac) 22%,var(--surface));border-top:1px solid color-mix(in srgb,var(--ac) 40%,var(--line));border-right:1px solid color-mix(in srgb,var(--ac) 40%,var(--line));border-bottom:1px solid color-mix(in srgb,var(--ac) 40%,var(--line));padding:2px 4px 2px 5px;overflow:hidden;font-size:12px;line-height:1.2;cursor:grab;display:flex;gap:4px;touch-action:manipulation;user-select:none;-webkit-user-select:none}
html[data-color=bold] .blk{background:var(--ac);color:#fff;border-color:var(--ac);border-left-color:color-mix(in srgb,var(--ac) 60%,#000)}
.blk.done{opacity:.55}
.blk.done .bt{text-decoration:line-through}
.blk .bck{flex:none;width:15px;height:15px;margin-top:1px;border-radius:4px;border:1.5px solid currentColor;background:none;padding:0;color:inherit;display:flex;align-items:center;justify-content:center;opacity:.8}
.blk .bck svg{width:11px;height:11px;opacity:0}
.blk.done .bck{background:var(--ac);border-color:var(--ac);color:#fff;opacity:1}
html[data-color=bold] .blk.done .bck{background:#fff;color:var(--ac);border-color:#fff}
.blk.done .bck svg{opacity:1}
.blk .bt{font-weight:700;min-width:0}
.blk .bm{font-weight:500;opacity:.8;font-size:11px}
.blk .rz{position:absolute;left:0;right:0;bottom:0;height:8px;cursor:ns-resize}
.blk.drag{opacity:.85;z-index:10;box-shadow:0 8px 22px rgba(0,0,0,.3);cursor:grabbing}
.nowline{position:absolute;left:0;right:0;height:2px;background:var(--danger);z-index:4;pointer-events:none}
.nowline::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--danger)}
.pickbar{position:sticky;top:0;z-index:6;margin:8px 0;padding:8px 12px;border-radius:11px;background:var(--accent);color:var(--accent-ink);display:flex;gap:8px;align-items:center;font-weight:600;font-size:13.5px}
.pickbar span{flex:1;min-width:0}
.pickbar button{border:1px solid rgba(255,255,255,.5);background:rgba(255,255,255,.15);color:inherit;border-radius:8px;padding:4px 10px;font-weight:700}
.fitpanel{padding:10px}
.fitpanel h3{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.pitem{--ac:#7A828F;border-left:4px solid var(--ac);border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line);border-radius:8px;padding:6px 8px;margin-bottom:5px;font-size:13px;font-weight:600;cursor:pointer;background:var(--surface)}
.pitem small{display:block;font-weight:500;color:var(--muted);font-size:11.5px}
@media (min-width:1000px){.fitpanel{max-height:calc(100vh - 220px);overflow:auto;position:sticky;top:72px}}

/* ---------- Revisão ---------- */
.bars{display:flex;flex-direction:column;gap:10px;padding:14px}
.bar{--ac:#7A828F}
.bar .bl{display:flex;justify-content:space-between;font-size:13.5px;font-weight:700;margin-bottom:4px}
.bar .bt2{height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.bar .bt2 i{display:block;height:100%;background:var(--ac);border-radius:99px}
.rev textarea{width:100%;min-height:84px;padding:10px 12px;border:1px solid var(--line2);border-radius:11px;background:var(--surface);resize:vertical;font-size:16px}
.rev label{display:block;font-weight:700;font-size:13.5px;margin:12px 0 5px}

/* ---------- Gráficos ---------- */
.cchart{display:flex;gap:6px;align-items:flex-end;height:178px}
.ccol{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch}
.ctot{text-align:center;font-size:11px;font-weight:700;color:var(--muted);margin-bottom:3px;min-height:14px}
.cstk{display:flex;flex-direction:column-reverse;border-radius:6px;overflow:hidden;background:transparent}
.cseg{width:100%;min-height:2px}
.cwl{text-align:center;font-size:10.5px;color:var(--muted);margin-top:5px}
.ccol.cur .cwl{color:var(--ink);font-weight:800}
.ccol.cur .ctot{color:var(--ink)}
.clegend{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:10px;font-size:12px;color:var(--muted)}
.clegend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
/* ---------- Etapas ---------- */

<script>
(function(){
'use strict';

/* ====================== CONFIG ====================== */

const p2 = n=>String(n).padStart(2,'0');

let S = {tasks:{}, areas:{}, pads:{}, settings:{}, uid:null};
const UI = {tab:'hoje', day:todayISO(), weekStart:mondayOf(todayISO()), weekDay:todayISO(), area:'*', tag:null, pick:null,
            padMode:'list', qaArea:'faculdade', fitOpen:false, wkMode:'week', monthStart:todayISO().slice(0,8)+'01', monthSel:todayISO()};
let fb=null, db=null, auth=null, user=null, ref=null, unsub=null, localOnly=false, booted=false, syncState='';
const dirty = {tasks:new Set(), areas:new Set(), pads:new Set(), reviews:new Set(), settings:false};

    notes:'', tag:'', created:Date.now()}, p||{});
}
const openTasks = ()=>Object.values(S.tasks).filter(t=>!t.done&&!t.archived);
const areaList = ()=>Object.entries(S.areas).map(([id,a])=>Object.assign({id},a)).sort((a,b)=>(a.order||0)-(b.order||0)||cmpStr(a.name,b.name));
const areaOf = id=>S.areas[id]||{name:'(sem área)',color:'#7A828F',tags:[]};


/* ====================== PERSISTENCE ====================== */
function setSync(s){
  syncState=s;
  const el=$('#syncTxt'); if(!el)return;
  const m={pending:['off','salvando…'],ok:['','salvo na nuvem'],local:['off','só neste aparelho'],err:['off','erro ao salvar — tentando de novo']};

function saveLocal(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function touch(coll,id){
  if(coll==='settings') dirty.settings=true; else dirty[coll].add(id);
  saveLocal(); clearTimeout(flushT); flushT=setTimeout(flush,400);
  if(ref) setSync('pending');
}
async function flush(){
  if(!ref){ setSync('local'); return; }
  const data={}; let any=false;
  const sent={tasks:[],areas:[],pads:[]};
  COLLS.forEach(c=>{
    if(!dirty[c].size) return;
    data[c]={}; any=true;
    dirty[c].forEach(id=>{
      data[c][id] = S[c][id]===undefined ? firebase.firestore.FieldValue.delete() : clone(S[c][id]);

  if(!any) return;
  const sentSettings=dirty.settings;
  try{
    await ref.set(data,{merge:true});
    COLLS.forEach(c=>sent[c].forEach(id=>dirty[c].delete(id)));
    if(sentSettings) dirty.settings=false;
    if(!anyDirty()) setSync('ok');
  }catch(e){
    console.error(e); setSync('err');
    clearTimeout(flushT); flushT=setTimeout(flush,5000);
  }
}
const anyDirty = ()=>COLLS.some(c=>dirty[c].size)||dirty.settings;
window.addEventListener('beforeunload',()=>{ saveLocal(); });
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden'){ saveLocal(); if(anyDirty()) flush(); }});


function loadLocal(){
  try{
    const raw=localStorage.getItem(KEY);
    if(raw){ const o=JSON.parse(raw); COLLS.forEach(c=>S[c]=o[c]||{}); S.settings=o.settings||{}; S.uid=o.uid||null; return true; }
  }catch(e){}
  return false;
}

function markAllDirty(){}

function mergeRemote(d){
  COLLS.forEach(c=>{
    const r=d[c]||{};
    Object.keys(r).forEach(id=>{ if(!dirty[c].has(id)) S[c][id]=r[id]; });
    Object.keys(S[c]).forEach(id=>{ if(!(id in r) && !dirty[c].has(id)) delete S[c][id]; });
  });

}
function userIsBusy(){
  if($('#overlay').children.length) return true;

const ICON = {

const SAN_OK={B:1,STRONG:1,I:1,EM:1,U:1,S:1,STRIKE:1,UL:1,OL:1,LI:1,BR:1,DIV:1,P:1,SPAN:1,FONT:1};
function sanitize(html){
  const t=document.createElement('template'); t.innerHTML=html;
  (function walk(n){
    Array.from(n.childNodes).forEach(c=>{
      if(c.nodeType===3) return;
      if(c.nodeType!==1){ c.remove(); return; }
      if(!SAN_OK[c.tagName]){
        if(/^(SCRIPT|STYLE|IFRAME|OBJECT|EMBED|LINK|META)$/.test(c.tagName)){ c.remove(); return; }
        walk(c); while(c.firstChild) n.insertBefore(c.firstChild,c); c.remove(); return;
      }
      Array.from(c.attributes).forEach(a=>{
        if(c.tagName==='FONT' && a.name==='size' && /^[1-7]$/.test(a.value)) return;
        if(c.tagName==='SPAN' && a.name==='style'){
          const m=/background-color:\s*(#[0-9a-fA-F]{3,8}|rgb\([\d\s,.]+\))/.exec(a.value);
          if(m){ c.setAttribute('style','background-color:'+m[1]); return; }
        }
        c.removeAttribute(a.name);
      });
      walk(c);
    });
  })(t.content);
  return t.innerHTML;
}

function layoutDay(items){
  items.sort((a,b)=>a.s-b.s||b.e-a.e);
  const out=[]; let cluster=[], cEnd=-1;
  const flushC=()=>{
    const cols=[];
    cluster.forEach(it=>{ let c=cols.findIndex(end=>end<=it.s); if(c<0){c=cols.length;cols.push(0);} cols[c]=it.e; it.col=c; });
    cluster.forEach(it=>it.n=cols.length); out.push(...cluster); cluster=[];
  };
  items.forEach(it=>{ if(cluster.length && it.s>=cEnd){ flushC(); cEnd=-1; } cluster.push(it); cEnd=Math.max(cEnd,it.e); });
  if(cluster.length) flushC();
  return out;
}

  const prevScroll=(v.dataset.view==='semana' && v.dataset.ws===ws && $('.wk-scroll'))?$('.wk-scroll').scrollTop:null;
  v.dataset.view='semana'; v.dataset.ws=ws;
  const tasks=Object.values(S.tasks).filter(t=>!t.archived);

/* ----- drag / resize in week grid ----- */
let drag=null, suppressClick=0;
const snap15=x=>Math.round(x/15)*15;
document.addEventListener('pointerdown',e=>{
  const rz=e.target.closest('.rz'), blk=e.target.closest('.blk');
  if(!blk || e.target.closest('.bck')) return;
  if(e.pointerType==='touch') return;
  const t=S.tasks[blk.dataset.id]; if(!t) return;
  drag={mode:rz?'rz':'mv', id:t.id, blk, sx:e.clientX, sy:e.clientY, moved:false, t0:t.time, d0:t.date, dur0:t.dur, H:hh(), cols:$$('.wk-col'), nt:t.time, nd:t.date, ndur:t.dur};
  e.preventDefault();
});
document.addEventListener('pointermove',e=>{
  if(!drag) return;
  const dy=e.clientY-drag.sy, dx=e.clientX-drag.sx;
  if(!drag.moved && Math.hypot(dx,dy)<5) return;
  drag.moved=true; drag.blk.classList.add('drag');
  const H=drag.H;
  if(drag.mode==='rz'){
    drag.ndur=Math.max(15,snap15(drag.dur0+dy/H*60));
    drag.blk.style.height=Math.max(18,drag.ndur/60*H-1)+'px';
  } else {
    drag.nt=Math.min(HEND*60-15,Math.max(HSTART*60,snap15(drag.t0+dy/H*60)));
    const col=drag.cols.find(c=>{const r=c.getBoundingClientRect();return e.clientX>=r.left&&e.clientX<r.right;});
    if(col){ drag.nd=col.dataset.date; if(drag.blk.parentNode!==col){ col.appendChild(drag.blk); drag.blk.style.left='1px'; drag.blk.style.width='calc(100% - 3px)'; } }
    drag.blk.style.top=((drag.nt-HSTART*60)/60*H)+'px';
  }
});
document.addEventListener('pointerup',()=>{
  if(!drag) return;
  const d=drag; drag=null;
  if(!d.moved) return;
  suppressClick=Date.now()+150;
  if(d.mode==='rz') patch(d.id,{dur:d.ndur}); else patch(d.id,{date:d.nd,time:d.nt});
  render();
});
function schedulePick(date,min){
  const id=UI.pick; if(!id||!S.tasks[id]) return;
  UI.pick=null;
  withUndo([id],'Agendado para '+fmtShort(date)+' às '+fmtT(min), ()=>patch(id,{date,time:min,tri:0}));
}

/* ====================== ÁREAS ====================== */
function areaSections(list){
  const today=todayISO();
  const open=list.filter(t=>!t.done&&!t.archived);
  return {
    over:open.filter(t=>(t.date&&t.date<today)||(!t.date&&t.due&&t.due<today)).sort((a,b)=>(a.date||a.due).localeCompare(b.date||b.due)),
    next:open.filter(t=>t.date&&t.date>=today).sort((a,b)=>a.date.localeCompare(b.date)||(a.time||0)-(b.time||0)),
    some:open.filter(t=>!t.date&&!(t.due&&t.due<today)).sort((a,b)=>(a.due||'9').localeCompare(b.due||'9')||a.created-b.created),
    done:list.filter(t=>t.done&&!t.archived).sort((a,b)=>(b.doneAt||0)-(a.doneAt||0)),
    arch:list.filter(t=>t.archived)
  };
}
function moveArea(dir){
  const l=areaList(), i=l.findIndex(a=>a.id===EDIT.area), j=i+dir;
  if(j<0||j>=l.length) return;
  [l[i],l[j]]=[l[j],l[i]];
  l.forEach((a,k)=>{ if(S.areas[a.id].order!==k+1){ S.areas[a.id].order=k+1; touch('areas',a.id); } });
  render(); toast('Ordem atualizada');
}
function deleteArea(){
  const id=EDIT.area, n=Object.values(S.tasks).filter(t=>t.area===id).length;
  const others=areaList().filter(a=>a.id!==id);
  if(!others.length){ toast('Precisa existir ao menos uma área.'); return; }
  const dest=others.find(a=>a.id==='outros')||others[0];
  if(n && !confirm('Mover as '+n+' tarefas desta área para "'+dest.name+'" e excluir a área?')) return;
  Object.values(S.tasks).forEach(t=>{ if(t.area===id){ t.area=dest.id; touch('tasks',t.id); } });
  delete S.areas[id]; touch('areas',id); UI.area='*'; EDIT=null; closeSheet(); render();
}

   +'<div class="fld"><label>Cópia de segurança</label><div class="acts" style="margin:0"><button class="btn" data-act="export">Exportar</button><button class="btn" data-act="import">Importar</button><button class="btn" data-act="print-week">Imprimir semana</button></div><input type="file" id="imp-file" accept=".json,application/json" class="hidden"></div>'
   +(user?'<div class="fld"><label>Conta</label><div class="small muted" style="margin-bottom:6px">'+esc(user.email||'')+'</div><button class="btn danger" data-act="logout">Sair</button></div>':'<div class="small muted">Modo local: os dados ficam só neste aparelho.</div>'));
}
function exportBackup(){
  const blob=new Blob([JSON.stringify({app:'organizador-lite',v:1,exportedAt:new Date().toISOString(),tasks:S.tasks,areas:S.areas,pads:S.pads,settings:S.settings},null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='organizador-backup-'+todayISO()+'.json';
  document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
}
function importData(p){
  if(!(p && p.app==='organizador-lite' && p.tasks)){ toast('Esse arquivo não é um backup deste app.'); return; }
  if(!confirm('Importar vai juntar o backup ao que já existe (tarefas com o mesmo código serão substituídas). Continuar?')) return;
  COLLS.forEach(c=>Object.keys(p[c]||{}).forEach(id=>{ S[c][id]=p[c][id]; touch(c,id); }));
  closeSheet(); render(); toast(Object.keys(p.tasks).length+' tarefas importadas.');
}

function setPage(css){
  let st=$('#pgstyle'); if(!st){ st=document.createElement('style'); st.id='pgstyle'; document.head.appendChild(st); }
  st.textContent='@page{'+css+'}';
}
function doPrint(){
  setTimeout(()=>{ window.print(); },80);
}
window.addEventListener('afterprint',()=>{ const p=$('#printRoot'); if(p) p.innerHTML=''; });
function printWeek(){
  closeSheet();
  const ws=UI.weekStart, days=weekDays(ws);
  const tasks=Object.values(S.tasks).filter(t=>!t.archived&&t.date&&t.date>=ws&&t.date<=days[6]);
  const timed=tasks.filter(t=>t.time!=null);
  let h0=7,h1=21;
  timed.forEach(t=>{ h0=Math.min(h0,Math.floor(t.time/60)); h1=Math.max(h1,Math.ceil((t.time+t.dur)/60)); });
  const H=36, total=(h1-h0)*H;
  const d0=parseD(ws), d6=parseD(days[6]);
  let h='<h1>Semana de '+d0.getDate()+' '+MN[d0.getMonth()]+' a '+d6.getDate()+' '+MN[d6.getMonth()]+' de '+d6.getFullYear()+'</h1><div class="sub">'+esc(APP_NAME)+' · impresso em '+fmtShort(todayISO())+'</div>';
  h+='<table class="wkp"><tr><th style="width:34px"></th>'+days.map(d=>{const dt=parseD(d);return '<th>'+WD[dt.getDay()]+' '+dt.getDate()+'</th>';}).join('')+'</tr><tr><td style="position:relative;height:'+total+'px">'
    +Array.from({length:h1-h0},(_,i)=>'<div class="hr" style="top:'+(i*H)+'px">'+p2(h0+i)+'h</div>').join('')+'</td>';
  days.forEach(d=>{
    const items=layoutDay(timed.filter(t=>t.date===d).map(t=>({t,s:t.time,e:t.time+Math.max(t.dur,15)})));
    h+='<td><div class="pcol" style="height:'+total+'px">'+Array.from({length:h1-h0},(_,i)=>'<div class="hl" style="top:'+(i*H)+'px"></div>').join('')
     +items.map(it=>{const t=it.t,c=areaOf(t.area).color;
       return '<div class="pblk" style="top:'+((it.s-h0*60)/60*H)+'px;height:'+Math.max(12,(it.e-it.s)/60*H-1)+'px;left:calc('+it.col+'*100%/'+it.n+');width:calc(100%/'+it.n+' - 1px);background:color-mix(in srgb,'+c+' 28%,#fff);border-color:'+c+'">'
       +'<b'+(t.done?' style="text-decoration:line-through"':'')+'>'+esc(t.title)+'</b> <span style="color:#444">'+fmtT(t.time)+'</span></div>';}).join('')+'</div></td>';
  });
  h+='</tr></table><div class="pun"><span></span>'+days.map(d=>{
    const us=tasks.filter(t=>t.date===d&&t.time==null);
    return '<div><b>Sem horário</b>'+us.map(t=>'<div style="border:0;padding:1px 0;min-height:0;'+(t.done?'text-decoration:line-through;color:#777':'')+'"><span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:'+areaOf(t.area).color+';margin-right:3px"></span>'+esc(t.title)+'</div>').join('')+'</div>';
  }).join('')+'</div>';
  h+='<div class="sub" style="margin-top:8px">'+areaList().map(a=>'<span style="display:inline-block;width:9px;height:9px;border-radius:2px;background:'+a.color+';margin:0 3px 0 10px"></span>'+esc(a.name)).join('')+'</div>';
  $('#printRoot').innerHTML=h; setPage('size:A4 landscape;margin:9mm'); doPrint();
}

/* ====================== EVENTOS GLOBAIS ====================== */
const firstOfMonth=d=>d.slice(0,8)+'01';
const ACT = {
  tab:el=>{ UI.tab=el.dataset.tab; window.scrollTo(0,0); render(); },
  new:()=>openEditor(null),
  menu:()=>openSettings(),
  undo:()=>{ const f=toast.fn; $('.toast')&&$('.toast').remove(); if(f) f(); },
  toggle:(el,id)=>toggleDone(id),
  edit:(el,id)=>{ if(Date.now()<suppressClick) return; openEditor(id); },
  more:(el,id)=>moreMenu(el,id),
  'mv-today':(el,id)=>moveTask(id,'today'), 'mv-tom':(el,id)=>moveTask(id,'tom'), 'mv-some':(el,id)=>moveTask(id,'some'),
  'mv-week':(el,id)=>moveTask(id,'week'), 'mv-drop':(el,id)=>moveTask(id,'drop'),
  unarch:(el,id)=>withUndo([id],'Tarefa restaurada',()=>patch(id,{archived:false})),
  dup:(el,id)=>duplicateTask(id), del:(el,id)=>deleteTask(id),
  'over-some':()=>{ const ids=openTasks().filter(t=>t.date&&t.date<todayISO()).map(t=>t.id); withUndo(ids,ids.length+' tarefas para Algum dia',()=>ids.forEach(id=>patch(id,{date:null,time:null}))); },
  'old-over':()=>{ UI.tab='areas'; UI.area='*'; UI.tag=null; window.scrollTo(0,0); render(); },
  'dl-all':()=>{ UI.dlAll=!UI.dlAll; render(); },
  'day-prev':()=>{ UI.day=addDays(UI.day,-1); render(); }, 'day-next':()=>{ UI.day=addDays(UI.day,1); render(); }, 'day-today':()=>{ UI.day=todayISO(); render(); },
  padmode:el=>{ UI.padMode=el.dataset.m; render(); },
  qa:()=>{ if(UI.tab==='hoje') quickAdd(UI.qaArea,UI.day); else quickAdd(UI.area==='*'?UI.qaArea:UI.area,null); },
  'wk-mode':el=>{ UI.wkMode=el.dataset.m; if(UI.wkMode==='month'){ UI.monthStart=firstOfMonth(UI.monthSel); } render(); },
  'wk-prev':()=>{ UI.weekStart=addDays(UI.weekStart,-7); UI.weekDay=UI.weekStart; render(); },
  'wk-next':()=>{ UI.weekStart=addDays(UI.weekStart,7); UI.weekDay=UI.weekStart; render(); },
  'wk-today':()=>{ UI.weekStart=mondayOf(todayISO()); UI.weekDay=todayISO(); render(); },
  'wk-day':el=>{ UI.weekDay=el.dataset.d; render(); },
  'm-prev':()=>{ const d=parseD(UI.monthStart); UI.monthStart=iso(new Date(d.getFullYear(),d.getMonth()-1,1)); UI.monthSel=UI.monthStart; render(); },
  'm-next':()=>{ const d=parseD(UI.monthStart); UI.monthStart=iso(new Date(d.getFullYear(),d.getMonth()+1,1)); UI.monthSel=UI.monthStart; render(); },
  'm-today':()=>{ UI.monthStart=firstOfMonth(todayISO()); UI.monthSel=todayISO(); render(); },
  'm-sel':el=>{ UI.monthSel=el.dataset.d; UI.monthStart=firstOfMonth(UI.monthSel); render(); },
  pick:(el,id)=>{ UI.pick=(UI.pick===id)?null:id; render(); },
  'pick-cancel':()=>{ UI.pick=null; render(); },
  'pick-edit':()=>{ const id=UI.pick; UI.pick=null; if(id) openEditor(id); },
  'fit-toggle':()=>{ UI.fitOpen=!UI.fitOpen; render(); },
  'print-week':()=>{ UI.tab='semana'; UI.wkMode='week'; printWeek(); },
  'area-sel':el=>{ UI.area=el.dataset.a; UI.tag=null; render(); },
  'tag-sel':el=>{ UI.tag=(UI.tag===el.dataset.tag)?null:el.dataset.tag; render(); },
  'area-new':()=>openAreaEditor(null), 'area-edit':()=>openAreaEditor(UI.area),
  'ar-color':el=>{ EDIT.color=el.dataset.c; $$('#ar-sw .sw').forEach(b=>b.classList.toggle('on',b===el)); },
  'ar-save':()=>saveArea(), 'ar-up':()=>moveArea(-1), 'ar-down':()=>moveArea(1), 'ar-del':()=>deleteArea(),
  'ar-tag-add':()=>{ const i=$('#ar-newtag'), v=i.value.trim(); if(v&&!EDIT.tags.includes(v)) EDIT.tags.push(v); i.value=''; renderAreaTags(); i.focus(); },
  'ar-tag-del':el=>{ EDIT.tags.splice(+el.dataset.i,1); renderAreaTags(); },
  'ed-close':()=>{ EDIT=null; closeSheet(); },
  'ed-area':el=>{ const t=EDIT.t; t.area=el.dataset.a; if(!(areaOf(t.area).tags||[]).includes(t.tag)) t.tag=''; $$('#ed-areas .achip').forEach(b=>b.classList.toggle('on',b===el)); renderTagChips(); },
  'ed-tag':el=>{ EDIT.t.tag=(EDIT.t.tag===el.dataset.tag)?'':el.dataset.tag; renderTagChips(); },
  'tg-add':()=>{ EDIT.adding=true; renderTagChips(); },
  'tg-save':()=>{
    const i=$('#ed-newtag'), v=i?i.value.trim():''; EDIT.adding=false;
    if(v){ const a=S.areas[EDIT.t.area]; a.tags=a.tags||[]; if(!a.tags.includes(v)){ a.tags.push(v); touch('areas',EDIT.t.area); } EDIT.t.tag=v; }
    renderTagChips();
  },
  'ed-d':el=>{
    const k=el.dataset.d, today=todayISO(), d=$('#ed-date');
    if(k==='today') d.value=today; else if(k==='tom') d.value=addDays(today,1);
    else if(k==='mon') d.value=addDays(mondayOf(today),7); else { d.value=''; $('#ed-time').value=''; }
  },
  'ed-save':()=>saveEditor(),
  'ed-done':()=>{ const id=EDIT.t.id; EDIT=null; closeSheet(); toggleDone(id); },
  'ed-dup':()=>{ const id=EDIT.t.id; EDIT=null; closeSheet(); duplicateTask(id); },
  'ed-del':()=>{ const id=EDIT.t.id; EDIT=null; closeSheet(); deleteTask(id); },
  set:el=>{ setSetting(el.dataset.k,el.dataset.v); openSettings(); },
  export:()=>exportBackup(),
  import:()=>{ const f=$('#imp-file'); f.onchange=()=>{ const file=f.files[0]; if(!file) return; const r=new FileReader(); r.onload=()=>{ try{ importData(JSON.parse(r.result)); }catch(e){ toast('Não consegui ler esse arquivo.'); } }; r.readAsText(file); }; f.click(); },
  logout:()=>{ closeSheet(); try{ localStorage.removeItem(KEY); }catch(e){} S={tasks:{},areas:{},pads:{},settings:{},uid:null}; if(auth) auth.signOut(); }
};

document.addEventListener('input',e=>{
  if(e.target.id==='pad'){ clearTimeout(padT); padT=setTimeout(savePad,600); }
  if(e.target.id==='ar-clr' && EDIT){ EDIT.color=e.target.value; $$('#ar-sw .sw').forEach(b=>b.classList.remove('on')); }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ closeMenu(); if($('#overlay').children.length){ EDIT=null; closeSheet(); } }
  if(e.key==='Enter' && e.target.id==='qa-input'){ e.preventDefault(); ACT.qa(); }
  if(e.key==='Enter' && e.target.id==='ed-title'){ e.preventDefault(); saveEditor(); }
  if(e.key==='Enter' && e.target.id==='ed-newtag'){ e.preventDefault(); ACT['tg-save'](); }
  if(e.key==='Enter' && e.target.id==='ar-newtag'){ e.preventDefault(); ACT['ar-tag-add'](); }
});

document.addEventListener('click',e=>{
  if(e.target.dataset && e.target.dataset.scrim){ EDIT=null; closeSheet(); return; }
  // blocos da semana: clique no vazio da coluna
  const col=e.target.closest('.wk-col');
  if(col && e.target===col){
    if(Date.now()<suppressClick) return;
    const r=col.getBoundingClientRect(), H=hh();
    const min=Math.min(HEND*60-15,Math.max(HSTART*60,Math.floor(((e.clientY-r.top)/H*60+HSTART*60)/15)*15));
    if(UI.pick) schedulePick(col.dataset.date,min); else openEditor(null,{date:col.dataset.date,time:min});
    return;
  }
  const cmd=e.target.closest('[data-cmd]');
  if(cmd){
    const c=cmd.dataset.cmd, pad=$('#pad'); if(!pad) return;
    pad.focus();
    if(c==='smaller'||c==='bigger'){ const cur=parseInt(document.queryCommandValue('fontSize'))||3; document.execCommand('fontSize',false,Math.min(7,Math.max(1,cur+(c==='bigger'?1:-1)))); }
    else if(c==='hilite'){ document.execCommand('hiliteColor',false,'#fff3a3'); }
    else document.execCommand(c,false,null);
    clearTimeout(padT); padT=setTimeout(savePad,300);
    return;
  }
  const el=e.target.closest('[data-act]');
  if(!el){ closeMenu(); return; }
  // ações aninhadas (checkbox/mais dentro do cartão) têm prioridade por serem o closest
  const fn=ACT[el.dataset.act]; if(!fn) return;
  const keepMenu=el.dataset.act==='more'; if(!keepMenu) closeMenu();
  fn(el, el.dataset.id, e);
  e.stopPropagation&&0;
});
document.addEventListener('mousedown',e=>{ if(e.target.closest('.padtools button')) e.preventDefault(); });
document.addEventListener('paste',e=>{
  if(e.target.id==='pad'){ e.preventDefault(); const txt=(e.clipboardData||window.clipboardData).getData('text/plain'); document.execCommand('insertText',false,txt); }
});
window.addEventListener('resize',()=>{ clearTimeout(window.__rz); window.__rz=setTimeout(()=>{ if(booted&&!userIsBusy()) render(); },200); });
setInterval(()=>{ if(booted && UI.tab==='semana' && UI.wkMode==='week' && !userIsBusy() && !drag) render(); },5*60*1000);

/* ====================== BOOT / AUTH ====================== */
function showApp(){ $('#boot').classList.add('hidden'); $('#app').classList.remove('hidden'); }
const AUTH_ERR={
  'auth/invalid-credential':'E-mail ou senha incorretos.','auth/wrong-password':'E-mail ou senha incorretos.','auth/user-not-found':'E-mail ou senha incorretos.',
  'auth/email-already-in-use':'Esse e-mail já tem conta. Toque em “Já tenho conta”.','auth/weak-password':'A senha precisa ter pelo menos 6 caracteres.',
  'auth/invalid-email':'E-mail inválido.','auth/too-many-requests':'Muitas tentativas. Espere um pouco e tente de novo.','auth/network-request-failed':'Sem internet no momento.'
};
function showLogin(msg,mode){
  mode=mode||'in';
  $('#app').classList.add('hidden');
  const b=$('#boot'); b.classList.remove('hidden');
  b.innerHTML='<form class="card login" id="loginForm"><h1>'+esc(APP_NAME)+'</h1>'
   +'<div class="muted small" style="margin-bottom:16px">'+(mode==='up'?'Crie sua conta para guardar suas tarefas e usar no celular e no computador.':'Entre para ver suas tarefas.')+'</div>'
   +'<div class="fld"><label>E-mail</label><input type="email" id="lg-mail" autocomplete="username" required></div>'
   +'<div class="fld"><label>Senha</label><input type="password" id="lg-pass" autocomplete="'+(mode==='up'?'new-password':'current-password')+'" required></div>'
   +'<div class="err" id="lg-err" style="min-height:20px">'+esc(msg||'')+'</div>'
   +'<button class="btn pri" style="width:100%;min-height:46px" type="submit" id="lg-go">'+(mode==='up'?'Criar conta':'Entrar')+'</button>'
   +'<div class="acts" style="justify-content:space-between;margin-top:14px"><button type="button" class="btn sm" id="lg-toggle" style="border-color:transparent">'+(mode==='up'?'Já tenho conta':'Criar conta')+'</button>'
   +(mode==='in'?'<button type="button" class="btn sm" id="lg-reset" style="border-color:transparent">Esqueci a senha</button>':'')+'</div></form>';
  $('#lg-toggle').onclick=()=>showLogin('',mode==='up'?'in':'up');
  const rs=$('#lg-reset'); if(rs) rs.onclick=async()=>{
    const m=$('#lg-mail').value.trim(); const er=$('#lg-err');
    if(!m){ er.textContent='Escreva seu e-mail acima e toque de novo.'; return; }
    try{ await auth.sendPasswordResetEmail(m); er.style.color='var(--ok)'; er.textContent='Enviei um e-mail para redefinir a senha (olhe também o spam).'; }
    catch(e){ er.style.color=''; er.textContent=AUTH_ERR[e.code]||'Não consegui enviar agora.'; }
  };
  $('#loginForm').onsubmit=async e=>{
    e.preventDefault();
    const go=$('#lg-go'), er=$('#lg-err'); go.disabled=true; er.style.color=''; er.textContent='';
    try{
      const m=$('#lg-mail').value.trim(), p=$('#lg-pass').value;
      if(mode==='up') await auth.createUserWithEmailAndPassword(m,p); else await auth.signInWithEmailAndPassword(m,p);
    }catch(err){ er.textContent=AUTH_ERR[err.code]||'Não consegui agora. Tente de novo.'; go.disabled=false; }
  };
}
function seedIfNeeded(){
  if(!Object.keys(S.areas).length){
    Object.keys(DEFAULT_AREAS).forEach(id=>{ S.areas[id]=clone(DEFAULT_AREAS[id]); touch('areas',id); });
  }
  if(!S.settings) S.settings={};
}
function startRemote(){
  unsub=ref.onSnapshot(snap=>{
    if(snap.metadata.hasPendingWrites) return;
    if(!snap.exists && snap.metadata.fromCache) return;
    if(snap.exists) mergeRemote(snap.data());
    seedIfNeeded(); saveLocal();
    if(!booted){ booted=true; showApp(); applySettings(); render(); } else renderSoon();
    if(!anyDirty()) setSync('ok');
  }, err=>{ console.error(err); setSync('err'); if(!booted){ booted=true; showApp(); render(); } });
}
function init(){
  loadLocal(); applySettings();
  const haveFB = typeof firebase!=='undefined' && FB_CONFIG.apiKey;
  if(!haveFB){
    localOnly=true; seedIfNeeded(); booted=true; showApp(); render(); setSync('local');
    return;
  }
  fb=firebase.initializeApp(FB_CONFIG); auth=firebase.auth(); db=firebase.firestore();
  if(S.uid && Object.keys(S.areas).length){ showApp(); render(); }
  auth.onAuthStateChanged(u=>{
    if(unsub){ unsub(); unsub=null; }
    if(!u){ user=null; ref=null; booted=false; showLogin(); return; }
    if(S.uid && S.uid!==u.uid){ S.tasks={}; S.areas={}; S.pads={}; S.settings={}; }
    S.uid=u.uid; saveLocal();
    user=u; ref=db.collection('users').doc(u.uid).collection('data').doc(DOC);
    setSync('pending'); startRemote();
  });
}


init();
})();
